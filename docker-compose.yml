services:
  postgres:
    image: postgres:15-alpine
    container_name: campusshield-db
    environment:
      POSTGRES_USER: campusshield
      POSTGRES_PASSWORD: campusshield
      POSTGRES_DB: campusshield
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusshield"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campusshield-backend
    environment:
      DATABASE_URL: postgresql://campusshield:campusshield@postgres:5432/campusshield
      SECRET_KEY: ${SECRET_KEY:-super-secret-key-for-dev-only-change-in-prod}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080,http://localhost
      UPLOAD_DIR: uploads
      # Local-only convenience. Production runs ./migrate.sh as a separate
      # one-off ECS task instead - see backend/entrypoint.sh.
      RUN_MIGRATIONS: "1"
    volumes:
      - ./backend/uploads:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: campusshield-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
