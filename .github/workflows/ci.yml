name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        env:
          # conftest.py also sets these; they are repeated here so the
          # intent is visible and a stray .env can never leak into CI.
          DATABASE_URL: sqlite:///./ci_test.db
          SECRET_KEY: ci-test-secret-key
          GEMINI_API_KEY: ""
          UPLOAD_DIR: /tmp/campusshield_ci_uploads
        run: pytest --cov=app --cov-report=term-missing

  frontend:
    name: Frontend lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # Separate job on purpose: it never gates or replaces the two jobs above,
  # so a scanner outage or a base-image CVE cannot block a test run.
  # The frontend image is nginx + static assets; the backend image carries
  # the Python dependency tree, so that is what we gate on.
  backend-image-scan:
    name: Backend image scan (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image (load only, never pushed from CI)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          load: true
          tags: campusshield-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan - fail on CRITICAL
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: campusshield-backend:ci
          format: table
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true

      - name: Trivy scan - report HIGH (informational, does not fail)
        if: always()
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: campusshield-backend:ci
          format: table
          exit-code: "0"
          severity: HIGH
          ignore-unfixed: true
