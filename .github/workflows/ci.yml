name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Audit backend dependencies
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        env:
          # conftest.py also sets these; they are repeated here so the
          # intent is visible and a stray .env can never leak into CI.
          DATABASE_URL: sqlite:///./ci_test.db
          SECRET_KEY: ci-test-secret-key
          GEMINI_API_KEY: ""
          UPLOAD_DIR: /tmp/campusshield_ci_uploads
        run: pytest --cov=app --cov-report=term-missing

  frontend:
    name: Frontend lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Scan secrets with gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  terraform-check:
    name: Terraform validation
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.10.5

      - name: Terraform format check
        run: terraform -chdir=infrastructure/terraform fmt -check -recursive

      - name: Terraform init
        run: terraform -chdir=infrastructure/terraform init -backend=false

      - name: Terraform validate
        run: terraform -chdir=infrastructure/terraform validate

      - name: Terraform bootstrap-state init
        run: terraform -chdir=infrastructure/terraform/bootstrap-state init -backend=false

      - name: Terraform bootstrap-state validate
        run: terraform -chdir=infrastructure/terraform/bootstrap-state validate

      - name: Scan Terraform configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: infrastructure/terraform
          format: table
          exit-code: "1"
          severity: CRITICAL

      - name: Report high Terraform findings
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: infrastructure/terraform
          format: table
          exit-code: "0"
          severity: HIGH

  # Separate job on purpose: it never gates or replaces the two jobs above,
  # so a scanner outage or a base-image CVE cannot block a test run.
  # The frontend image is nginx + static assets; the backend image carries
  # the Python dependency tree, so that is what we gate on.
  backend-image-scan:
    name: Backend image scan (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build backend image (load only, never pushed from CI)
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ./backend
          load: true
          tags: campusshield-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan - fail on CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: campusshield-backend:ci
          format: table
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true

      - name: Trivy scan - report HIGH (informational, does not fail)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: campusshield-backend:ci
          format: table
          exit-code: "0"
          severity: HIGH
          ignore-unfixed: true

  frontend-image-scan:
    name: Frontend image scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build frontend image (load only, never pushed from CI)
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ./frontend
          load: true
          tags: campusshield-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan - fail on CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: campusshield-frontend:ci
          format: table
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Review dependency changes
        uses: actions/dependency-review-action@595b5aeba73380359d98a5e087f648dbb0edce1b # v4.7.3
        with:
          fail-on-severity: high
          comment-summary-in-pr: false
